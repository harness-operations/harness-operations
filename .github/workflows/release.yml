name: Release Harness Operations

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag, for example v0.7
        required: true
        type: string
      title:
        description: Release title
        required: true
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: harness-operations-release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      title: ${{ steps.meta.outputs.title }}
      notes_file: ${{ steps.meta.outputs.notes_file }}
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Releases must be cut from main." >&2
          exit 1

      - name: Checkout exact release commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate release request
        id: meta
        env:
          VERSION: ${{ inputs.version }}
          TITLE: ${{ inputs.title }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Invalid version: $VERSION" >&2
            exit 1
          fi

          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "Tag already exists: $VERSION" >&2
            exit 1
          fi

          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release already exists: $VERSION" >&2
            exit 1
          fi

          notes_file="releases/$VERSION.md"
          if [[ ! -f "$notes_file" ]]; then
            notes_file=""
          fi

          {
            echo "version=$VERSION"
            echo "title=$TITLE"
            echo "notes_file=$notes_file"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Validate canonical data
        run: |
          python -m pip install 'jsonschema>=4.23,<5'
          python systems/validate.py
          python comparisons/validate.py

      - name: Run approved handoff example
        working-directory: examples/approved-artifact-handoff
        run: |
          python -m unittest -v
          python demo.py

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Run exact-version Harness interface smoke
        run: bash tests/interface-smoke.sh

      - name: Install site dependencies
        working-directory: site
        run: npm ci --no-audit --no-fund

      - name: Build site from release commit
        working-directory: site
        run: npm run build

      - name: Install Chromium
        working-directory: site
        run: npx playwright install --with-deps chromium

      - name: Browser smoke tests
        working-directory: site
        run: npm run test:smoke

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create annotated release tag
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          TITLE: ${{ needs.verify.outputs.title }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" "$GITHUB_SHA" -m "$TITLE"
          git push origin "$VERSION"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
          TITLE: ${{ needs.verify.outputs.title }}
          NOTES_FILE: ${{ needs.verify.outputs.notes_file }}
        run: |
          if [[ -n "$NOTES_FILE" ]]; then
            gh release create "$VERSION" --verify-tag --title "$TITLE" --notes-file "$NOTES_FILE"
          else
            gh release create "$VERSION" --verify-tag --title "$TITLE" --generate-notes
          fi

  deploy:
    needs:
      - verify
      - publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  live-qa:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install site dependencies
        working-directory: site
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        working-directory: site
        run: npx playwright install --with-deps chromium

      - name: Smoke test production
        working-directory: site
        env:
          LIVE_BASE_URL: https://harness-operations.com
        run: npm run test:smoke
