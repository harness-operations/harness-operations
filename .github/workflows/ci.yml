name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate GitHub Actions workflows
        run: |
          curl -fsSLo /tmp/actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint -color

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Validate canonical data
        run: |
          python -m pip install 'jsonschema>=4.23,<5'
          python systems/validate.py
          python comparisons/validate.py

      - name: Run approved handoff example
        working-directory: examples/approved-artifact-handoff
        run: |
          python -m unittest -v
          python demo.py

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Run exact-version Harness interface smoke
        run: bash tests/interface-smoke.sh

      - name: Install site dependencies
        working-directory: site
        run: npm ci --no-audit --no-fund

      - name: Build site from this checkout
        working-directory: site
        run: npm run build

      - name: Install Chromium
        working-directory: site
        run: npx playwright install --with-deps chromium

      - name: Browser smoke tests
        working-directory: site
        run: npm run test:smoke
