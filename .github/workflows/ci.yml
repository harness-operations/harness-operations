name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate GitHub Actions workflows
        run: |
          curl -fsSLo /tmp/actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint -color

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Validate canonical data
        run: |
          python -m pip install 'jsonschema>=4.23,<5'
          python systems/validate.py
          python comparisons/validate.py

      - name: Run approved handoff example
        working-directory: examples/approved-artifact-handoff
        run: |
          python -m unittest -v
          python demo.py

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Run exact-version Harness interface smoke
        run: bash tests/interface-smoke.sh

      - name: Install site dependencies
        working-directory: site
        run: npm ci --no-audit --no-fund

      - name: Test discovery rules, catalog links, and artwork integrity
        working-directory: site
        run: npm run test:unit

      - name: Build site from this checkout
        working-directory: site
        run: npm run build

      - name: Include exact tracked source for reproducible PR review
        if: github.event_name == 'pull_request'
        run: |
          git archive --format=tar --output=site/review-source.tar HEAD
          git rev-parse HEAD > site/review-source-commit.txt

      - name: Install Chromium and WebKit
        working-directory: site
        run: npx playwright install --with-deps chromium webkit

      - name: Browser smoke tests
        working-directory: site
        run: npm run test:smoke

      - name: Upload PR review build and screenshots
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: site-review
          path: |
            site/dist
            site/test-results
            site/review-source.tar
            site/review-source-commit.txt
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  live-qa:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployed commit
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install site dependencies
        working-directory: site
        run: npm ci --no-audit --no-fund

      - name: Install Chromium and WebKit
        working-directory: site
        run: npx playwright install --with-deps chromium webkit

      - name: Smoke test production
        working-directory: site
        env:
          LIVE_BASE_URL: https://harness-operations.com
        run: npm run test:smoke
